name: BotPyton persistent worker

on:
  workflow_dispatch:
    inputs:
      tasks_json:
        description: "JSON task object or array (allowed actions only; no commands are executed from task text)"
        required: false
        default: "[]"
        type: string
      work_limit:
        description: "Maximum number of queue claims in this run (1–100)"
        required: true
        default: 10
        type: number
  push:
    branches:
      - bot-bootstrap/phase-04-persistent-checkpoint

permissions:
  actions: read
  contents: read

concurrency:
  group: botpyton-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find latest retained checkpoint from this branch
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const refName = (context.ref || "").startsWith("refs/heads/")
              ? context.ref.slice("refs/heads/".length)
              : context.ref;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 387184205,
              branch: refName,
              status: "completed",
              per_page: 50,
            });
            core.info(`Found ${response.data.workflow_runs.length} completed run(s) for this worker workflow on ${refName}.`);
            for (const run of response.data.workflow_runs) {
              if (run.id === context.runId || run.head_branch !== refName) continue;
              const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100,
              });
              const artifact = artifactsResponse.data.artifacts.find(
                item => item.name === "botpyton-queue-checkpoint" && !item.expired
              );
              if (artifact) {
                core.setOutput("found", "true");
                core.setOutput("run_id", String(run.id));
                core.setOutput("artifact_id", String(artifact.id));
                core.info(`Using checkpoint artifact ${artifact.id} from run ${run.id} (sha ${run.head_sha}).`);
                return;
              }
            }
            core.setOutput("found", "false");
            core.info("No retained checkpoint found for this branch; a fresh queue will be initialized.");

      - name: Download previous checkpoint
        if: steps.previous.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: botpyton-queue-checkpoint
          path: ${{ runner.temp }}/botpyton-checkpoint-in
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous.outputs.run_id }}

      - name: Verify and restore checkpoint
        if: steps.previous.outputs.found == 'true'
        run: |
          python -m bot.main --restore-checkpoint "$RUNNER_TEMP/botpyton-checkpoint-in" --memory "$RUNNER_TEMP/botpyton-state.json"
          python -m bot.main --resume --memory "$RUNNER_TEMP/botpyton-state.json"

      - name: Initialize empty queue when no checkpoint exists
        if: steps.previous.outputs.found != 'true'
        run: python -m bot.main --check --memory "$RUNNER_TEMP/botpyton-state.json"

      - name: Parse optional task JSON input
        id: task_input
        env:
          BOTPYTON_TASKS_JSON: ${{ inputs.tasks_json || '[]' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("BOTPYTON_TASKS_JSON", "[]")
          tasks = json.loads(raw)
          if isinstance(tasks, dict):
              tasks = [tasks]
          if not isinstance(tasks, list) or any(not isinstance(task, dict) for task in tasks):
              raise SystemExit("tasks_json must be a JSON task object or an array of task objects")
          target = Path(os.environ["RUNNER_TEMP"]) / "botpyton-incoming-tasks.json"
          target.write_text(json.dumps(tasks, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_tasks={'true' if tasks else 'false'}\n")
          PY

      - name: Enqueue tasks supplied to this run
        if: steps.task_input.outputs.has_tasks == 'true'
        run: python -m bot.main --enqueue "$RUNNER_TEMP/botpyton-incoming-tasks.json" --memory "$RUNNER_TEMP/botpyton-state.json"

      - name: Seed one smoke task on the initial phase-branch push
        if: github.event_name == 'push' && steps.previous.outputs.found != 'true'
        run: python -m bot.main --enqueue .cerebro/examples/worker-task.json --memory "$RUNNER_TEMP/botpyton-state.json"

      - name: Execute bounded queue work
        env:
          BOTPYTON_WORK_LIMIT: ${{ inputs.work_limit || 10 }}
        run: |
          python -m bot.main --work-queue "$BOTPYTON_WORK_LIMIT" --memory "$RUNNER_TEMP/botpyton-state.json"

      - name: Export validated queue checkpoint
        if: always()
        run: python -m bot.main --export-checkpoint "$RUNNER_TEMP/botpyton-checkpoint-out" --memory "$RUNNER_TEMP/botpyton-state.json"

      - name: Upload queue checkpoint for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botpyton-queue-checkpoint
          path: ${{ runner.temp }}/botpyton-checkpoint-out/*
          if-no-files-found: error
          retention-days: 90

      - name: Upload execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botpyton-execution-reports
          path: .cerebro/reports/*.json
          if-no-files-found: warn
          retention-days: 7
