name: BotPyton Windows low-memory smoke

on:
  push:
    branches: [main, "bot-bootstrap/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check Python syntax and memory schema
        run: python -m bot.main --check
      - name: Run unit and safety tests
        run: python -m unittest discover -s tests -v
      - name: Report available RAM and disk
        run: python -m bot.main --system-profile
      - name: Exercise Windows Job Object with a fixed version probe
        run: python -m bot.main --probe-tool python
