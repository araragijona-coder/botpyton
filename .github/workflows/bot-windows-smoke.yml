name: BotPyton Windows low-memory smoke

on:
  push:
    branches: [main, "bot-bootstrap/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check Python syntax and memory schema
        run: python -m bot.main --check
      - name: Run unit and safety tests
        run: python -m unittest discover -s tests -v
      - name: Report available RAM and disk
        run: python -m bot.main --system-profile
      - name: Exercise bounded read-only PC care benchmark
        run: python -m bot.main --pc-benchmark
      - name: Inventory local device-driver metadata (read-only)
        run: python -m bot.main --pc-drivers
      - name: Build and verify portable package
        run: |
          python -m bot.main --package-portable "$env:RUNNER_TEMP\botpyton-dist"
          python -m bot.main --verify-portable-package "$env:RUNNER_TEMP\botpyton-dist\BOTPYTON-portable.zip"
      - name: Upload portable package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: botpyton-portable-windows
          path: ${{ runner.temp }}/botpyton-dist/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise Windows Job Object with a fixed version probe
        run: python -m bot.main --probe-tool python
