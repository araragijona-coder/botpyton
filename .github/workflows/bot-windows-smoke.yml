name: BotPyton Windows low-memory smoke

on:
  push:
    branches: [main, "bot-bootstrap/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check Python syntax and memory schema
        run: python -m bot.main --check
      - name: Run unit and safety tests
        run: python -m unittest discover -s tests -v
      - name: Exercise isolated browser-cache quarantine and restore fixtures
        run: python -m unittest discover -s tests -p test_application_cache_quarantine.py -v
      - name: Report available RAM and disk
        run: python -m bot.main --system-profile
      - name: Run actionable read-only preflight
        run: python -m bot.main --doctor
      - name: Preview allowlisted browser cache files (read-only)
        shell: pwsh
        run: |
          $output = python -m bot.main --pc-app-cleanup-preview
          $code = $LASTEXITCODE
          $output | Write-Output
          $report = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($code -eq 2 -and $report.operation_assessment.outcome -eq 'partial') {
            Write-Host 'PASS: application-cache preview explicitly reported a bounded partial result.'
            exit 0
          }
          if ($code -ne 0) { exit $code }
          if ($report.operation_assessment.outcome -ne 'reported_success') { throw 'Application-cache preview result was not recognized as a valid success.' }
      - name: Preview allowlisted Discord and Slack caches (read-only)
        shell: pwsh
        run: |
          $output = python -m bot.main --pc-desktop-cache-preview
          $code = $LASTEXITCODE
          $output | Write-Output
          $report = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($code -eq 2 -and $report.operation_assessment.outcome -eq 'partial') {
            Write-Host 'PASS: desktop-app cache preview explicitly reported a bounded partial result.'
            exit 0
          }
          if ($code -ne 0) { exit $code }
          if ($report.operation_assessment.outcome -ne 'reported_success') { throw 'Desktop-app cache preview result was not recognized as a valid success.' }
      - name: Inventory startup entry targets (read-only)
        shell: pwsh
        run: |
          $output = python -m bot.main --pc-startup-advisor
          $code = $LASTEXITCODE
          $output | Write-Output
          $report = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($code -eq 2 -and $report.operation_assessment.outcome -eq 'partial') {
            Write-Host 'PASS: startup advisor explicitly reported a bounded partial result.'
            exit 0
          }
          if ($code -ne 0) { exit $code }
          if ($report.operation_assessment.outcome -ne 'reported_success') { throw 'Startup advisor result was not recognized as a valid success.' }
      - name: Exercise bounded read-only PC care benchmark
        shell: pwsh
        run: |
          $output = python -m bot.main --pc-benchmark
          $code = $LASTEXITCODE
          $output | Write-Output
          $report = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($code -eq 2 -and $report.operation_assessment.outcome -eq 'partial') {
            Write-Host 'PASS: bounded benchmark explicitly reported partial measurements.'
            exit 0
          }
          if ($code -ne 0) { exit $code }
          if ($report.operation_assessment.outcome -ne 'reported_success') { throw 'Benchmark result was not recognized as a valid success.' }
      - name: Inventory local device-driver metadata (read-only)
        shell: pwsh
        run: |
          $output = python -m bot.main --pc-drivers
          $code = $LASTEXITCODE
          $output | Write-Output
          $report = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($code -eq 2 -and $report.operation_assessment.outcome -eq 'partial') {
            Write-Host 'PASS: driver inventory explicitly reported a bounded partial result.'
            exit 0
          }
          if ($code -ne 0) { exit $code }
          if ($report.operation_assessment.outcome -ne 'reported_success') { throw 'Driver inventory result was not recognized as a valid success.' }
      - name: Inspect Windows disk status metadata (read-only)
        shell: pwsh
        run: |
          $output = python -m bot.main --pc-disk-health
          $code = $LASTEXITCODE
          $output | Write-Output
          $report = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          if ($code -eq 2 -and $report.operation_assessment.outcome -eq 'partial') {
            Write-Host 'PASS: disk inventory explicitly reported a bounded partial result.'
            exit 0
          }
          if ($code -ne 0) { exit $code }
          if ($report.operation_assessment.outcome -ne 'reported_success') { throw 'Disk inventory result was not recognized as a valid success.' }
      - name: Build and verify portable package
        run: |
          python -m bot.main --package-portable "$env:RUNNER_TEMP\botpyton-dist"
          python -m bot.main --verify-portable-package "$env:RUNNER_TEMP\botpyton-dist\BOTPYTON-portable.zip"
      - name: Upload portable package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: botpyton-portable-windows
          path: ${{ runner.temp }}/botpyton-dist/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise Windows Job Object with a fixed version probe
        run: python -m bot.main --probe-tool python
