name: BotPyton foundation tests

on:
  push:
    branches: [main, "bot-bootstrap/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax and memory schema
        run: python -m bot.main --check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example task
        run: python -m bot.main --validate-task .cerebro/examples/example-task.json
      - name: Validate dependency plan
        run: python -m bot.main --plan .cerebro/examples/example-plan.json
      - name: Exercise deterministic task executor
        run: |
          python -m bot.main --enqueue .cerebro/examples/worker-task.json --memory "$RUNNER_TEMP/botpyton-state.json"
          python -m bot.main --work-queue 5 --memory "$RUNNER_TEMP/botpyton-state.json"
      - name: Exercise checkpoint export and restore
        run: |
          python -m bot.main --export-checkpoint "$RUNNER_TEMP/checkpoint-out" --memory "$RUNNER_TEMP/botpyton-state.json"
          python -m bot.main --restore-checkpoint "$RUNNER_TEMP/checkpoint-out" --memory "$RUNNER_TEMP/restored-state.json"
          python - <<'PY'
          import json
          from pathlib import Path
          original = json.loads(Path("$RUNNER_TEMP/botpyton-state.json").read_text(encoding="utf-8"))
          restored = json.loads(Path("$RUNNER_TEMP/restored-state.json").read_text(encoding="utf-8"))
          assert original == restored, "checkpoint restore changed queue state"
          assert restored["tasks"]["TASK-EXECUTOR-CI-001"]["status"] == "succeeded"
          print("CHECKPOINT ROUND TRIP PASS")
          PY
      - name: Upload executor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botpyton-executor-report
          path: .cerebro/reports/*.json
          if-no-files-found: warn
          retention-days: 7
