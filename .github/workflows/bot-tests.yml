name: BotPyton foundation tests

on:
  push:
    branches: [main, "bot-bootstrap/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax and memory schema
        run: python -m bot.main --check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example task
        run: python -m bot.main --validate-task .cerebro/examples/example-task.json
