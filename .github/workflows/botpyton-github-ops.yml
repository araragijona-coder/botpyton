name: BotPyton GitHub operations

on:
  push:
    branches:
      - bot-bootstrap/phase-06-github-operations
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Repository-relative path to a validated JSON change plan"
        required: true
        default: ".cerebro/examples/github-change-plan.json"
        type: string
      execute:
        description: "Create a branch, one commit and a draft pull request (default is dry-run)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: botpyton-github-ops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate plan and show dry-run summary
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOTPYTON_PLAN_PATH: ${{ inputs.plan_path || '.cerebro/examples/github-change-plan.json' }}
        run: python -m bot.main --github-plan "$BOTPYTON_PLAN_PATH"

  submit-draft-pr:
    # I-01 fail-closed: do not run a privileged sender until an independent trust boundary is verified.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Explain why live submission is disabled
        run: echo "Live PR submission is disabled pending verified repository trust controls."
